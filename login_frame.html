        function onEnterpress(e) {
            var KeyPress
            if (e && e.which) {
                e = e
                KeyPress = e.which
            }
            else {
                e = event
                KeyPress = e.keyCode
            }
            if (KeyPress == 13) {
                if ($("#ddlusertype").val() == '') {
                    alert("User can not be left blank!");
                    $("#ddlusertype").focus();
                    return (false);
                }
                __doPostBack('BtnLogin', '');
            }
            else return false;
        }

        function BtnSubmit() {

            if ($('#txtUser').val() == '') {
                alert("Username can not left blank!");
                $('#txtUser').focus();
                return false;
            }

            if ($('#txtPWD').val() == '') {
                alert("Password can not left blank!");
                $('#txtPWD').focus();
                return false;
            }

            if ($('#txtVerificationCode').val() == '') {
                alert("Captcha can not left blank!");
                $('#txtVerificationCode').focus();
                return false;
            }

            if ($('#TxtDomain').val() == '') {
                alert("Organisation can not left blank!");
                $('#TxtDomain').focus();
                return false;
            }

            if ($("#ddlusertype").val() == '') {
                alert("User Type can not be left blank");
                $("#ddlusertype").focus();
                return (false);
            }



            var key = CryptoJS.enc.Utf8.parse('8080808080808080');
            var iv = CryptoJS.enc.Utf8.parse('8080808080808080');



            var encryptedlogin = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse($("#txtUser").val()), key,

            { keySize: 128 / 8, iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });


          

            var encryptedpassword = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse( $("#txtPWD").val()), key,

            { keySize: 128 / 8, iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });




  
            $("#txtUser").val(encryptedlogin);
            $("#txtPWD").val(encryptedpassword);





        }
        function EmployeeChangeAlert() {

            }
            else {
                
                document.location.href = 'https://ipay.webtel.in' + "/Empuser/default.htm";//Added by GK
            }
        }

        function EmployeeAlert() {
            alert("Your password has been expired. Please contact your Admin!");
            Ctrlclear();
            return false;
        }
        function EmployeeConfirm() {
            var Msg = '';
            Msg = "Your password is going to be expired Today" + "\n" + "Press OK To update";
            if (confirm(Msg) == true) {
                
                document.location.href = "Empuser/frmempchangepassword.aspx?id=E";//Added by GK
            }
            else {
                Ctrlclear();
                return false;
            }
        }
       
        function ForgotPassword() {
            Msg = "Do you really want to reset password?";
            var domain = '';
            domain = $('#TxtDomain').val().trim();
            Empcodes = $('#txtUser').val().trim();
            if (Empcodes == '') {
                alert("Username can not left blank!");
                $("#txtUser").focus();
                return (false);
            }
            if (domain == '') {
                alert("Organisation can not left blank!");
                $("#TxtDomain").focus();
                return (false);
            }
            if (confirm(Msg) == false) {
                return false;
            }
        }
